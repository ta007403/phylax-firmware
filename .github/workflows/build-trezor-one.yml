# PHYLAX Blocks - build Trezor One (legacy) firmware from this fork.
#
# Put this file in your fork at:  .github/workflows/build-trezor-one.yml
#
# It runs when you push to the "phylax" branch, or when you press
# "Run workflow" on the Actions tab. The finished firmware appears as a
# downloadable zip at the bottom of the run's summary page.

name: Build Trezor One firmware

on:
  push:
    branches: [phylax]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # PHYLAX role of the build: stock = plain Trezor One behaviour,
        # main = main block (USB to the PC), key = key block,
        # blinstall = one-time PHYLAX bootloader installer.
        role: [stock, main, key, blinstall]
    env:
      PHYLAX_BUILD_ROLE: ${{ matrix.role }}

    steps:
      - name: Get the code from this fork
        uses: actions/checkout@v5

      - name: PHYLAX bootloader and signing
        # Once legacy/phylax_fw_keys_release.h is committed (phylax_sign.py
        # keys), PHYLAX builds also build the PHYLAX bootloader (PHYLAX's
        # keys and logo) and remember its hash. Before that, the installer
        # cannot be built and is skipped.
        id: signing
        run: |
          if [ -f legacy/phylax_fw_keys_release.h ] && [ "${{ matrix.role }}" != stock ]; then
            echo "PHYLAX_SIGNING=1" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.role }}" = blinstall ]; then
            echo "::notice::No PHYLAX release keys committed yet: skipping the bootloader installer"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Bitcoin-only Trezor One firmware (${{ matrix.role }})
        if: steps.signing.outputs.skip != 'true'
        # Trezor's own build script. It builds inside Docker from the
        # code checked out above, at the branch this run is for.
        #   --models T1B1  -> Trezor One only (skip newer models)
        #   --skip-normal  -> Bitcoin-only firmware only (smaller, faster)
        #
        # The script's very last step (printing a "fingerprint" of the
        # firmware) currently crashes on Trezor's main branch with
        # "No module named 'slhdsa'". That happens AFTER firmware.bin is
        # built, so we let it fail and then check that the firmware exists.
        # A real compile error still fails this step, because then
        # firmware.bin is missing.
        run: |
          bash build-docker.sh --models T1B1 --skip-normal "${{ github.ref_name }}" \
            || echo "::warning::build-docker.sh exited with an error; checking whether the firmware was built anyway"
          ls -l build/legacy-T1B1-bitcoinonly/firmware/ build/legacy-T1B1-bitcoinonly/bootloader/
          test -f build/legacy-T1B1-bitcoinonly/firmware/firmware.bin
          test -f build/legacy-T1B1-bitcoinonly/bootloader/bootloader.bin
          sha256sum build/legacy-T1B1-bitcoinonly/firmware/firmware.bin build/legacy-T1B1-bitcoinonly/bootloader/bootloader.bin
          # The bootloader hash as the firmware sees it (for phylax_bl_hashes.h)
          BLHASH=$(python3 -c "import hashlib,sys; d=open(sys.argv[1],'rb').read(); d+=bytes(32768-len(d)); print(hashlib.sha256(hashlib.sha256(d).digest()).hexdigest())" build/legacy-T1B1-bitcoinonly/bootloader/bootloader.bin)
          echo "bootloader hash: $BLHASH"
          # Shown on the run's summary page (Annotations)
          echo "::notice title=${{ matrix.role }} bootloader hash::$BLHASH"

      - name: Upload firmware
        if: steps.signing.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: trezor-one-bitcoinonly-${{ matrix.role }}-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/legacy-T1B1-bitcoinonly/firmware/
            build/legacy-T1B1-bitcoinonly/bootloader/bootloader.bin
          if-no-files-found: error
