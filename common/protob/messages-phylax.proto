syntax = "proto2";
package hw.trezor.messages.phylax;

// PHYLAX Blocks: snap-together multisig built on Trezor One firmware.
// Not part of upstream Trezor.

option java_package = "com.satoshilabs.trezor.lib.protobuf";
option java_outer_classname = "TrezorMessagePhylax";

import "messages-common.proto";
import "options.proto";

option (include_in_bitcoin_only) = true;

/**
 * Kind of block found on the PHYLAX bus.
 */
enum PhylaxBlockKind {
    PHYLAX_BLOCK_MAIN = 0;      // top block, USB to the PC
    PHYLAX_BLOCK_KEY = 1;       // holds one seed, signs
    PHYLAX_BLOCK_STORAGE = 2;   // reserved (every block keeps the saved wallets)
}

/**
 * One block in the stack, as seen by the main block.
 */
message PhylaxBlockInfo {
    required uint32 address = 1;            // bus address (main block = 1)
    required PhylaxBlockKind kind = 2;
    required bytes unique_id = 3;           // 12 bytes, stable until the block is wiped
    optional uint32 fingerprint = 4;        // BIP32 master key fingerprint of its seed (no passphrase)
    optional bool initialized = 5;          // has a seed
    optional bool locked = 6;               // PIN not entered: fingerprint unknown
    optional uint32 major_version = 7;
    optional uint32 minor_version = 8;
    optional uint32 patch_version = 9;
}

/**
 * Request: Ask the main block which blocks are in the stack
 * @start
 * @next PhylaxBlocks
 * @next Failure
 */
message PhylaxGetBlocks {
}

/**
 * Response: The blocks the main block currently sees, itself first
 * @end
 */
message PhylaxBlocks {
    repeated PhylaxBlockInfo blocks = 1;
}

/**
 * One key of a saved wallet: the block's seed fingerprint and its BIP48
 * P2WSH account xpub (m/48'/coin'/0'/2') for mainnet and testnet.
 */
message PhylaxWalletKey {
    required uint32 fingerprint = 1;                        // BIP32 master fingerprint
    required hw.trezor.messages.common.HDNodeType mainnet = 2;  // m/48'/0'/0'/2'
    required hw.trezor.messages.common.HDNodeType testnet = 3;  // m/48'/1'/0'/2'
}

/**
 * A saved wallet: wsh(sortedmulti(n, keys...)), n-of-n.
 * Summary, without xpubs (see PhylaxGetWallet for those).
 */
message PhylaxWalletSummary {
    required uint32 slot = 1;                   // 0..7, the same on every block
    required string name = 2;                   // e.g. "2-of-2 #1"
    required uint32 threshold = 3;              // m (= n for PHYLAX)
    repeated uint32 fingerprints = 4;           // sorted
    optional bool complete = 5;                 // every block is in the stack now
}

/**
 * Request: Ask the main block for the saved wallets
 * @start
 * @next PhylaxWallets
 * @next Failure
 */
message PhylaxGetWallets {
}

/**
 * Response: Saved wallets (every block keeps a copy of all of them)
 * @end
 */
message PhylaxWallets {
    repeated PhylaxWalletSummary wallets = 1;
    required bool storage_present = 2;          // every block's copy has been read
}

/**
 * Request: Ask the main block for one saved wallet, with its xpubs
 * @start
 * @next PhylaxWallet
 * @next Failure
 */
message PhylaxGetWallet {
    required uint32 slot = 1;
}

/**
 * Response: One saved wallet, everything needed for its descriptor
 * @end
 */
message PhylaxWallet {
    required uint32 slot = 1;
    required string name = 2;
    required uint32 threshold = 3;
    repeated PhylaxWalletKey keys = 4;          // sorted by fingerprint
    optional bool complete = 5;
}
